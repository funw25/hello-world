<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>悟理 PhysViz — 高中物理 3D 课堂演示</title>
<style>
  :root{
    --bg:#ffffff;
    --panel:#fbfbfc;
    --line:#e3e6ea;
    --text:#1f2933;
    --muted:#6b7280;
    --faint:#9aa1ab;
    --accent:#185fa5;
    --accent-soft:#e6f1fb;
    --warn:#ba7517;
    --hint-bg:#fffdf5;
    --hint-line:#f0e0b8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    color:var(--text);background:var(--bg);overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}

  #app{
    display:grid;
    grid-template-columns:300px 1fr 272px;
    grid-template-rows:56px 1fr 92px;
    height:100vh;
  }

  /* ---------- 顶栏 ---------- */
  #topbar{
    grid-column:1/-1;display:flex;align-items:center;gap:14px;
    padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel);
  }
  .brand{display:flex;align-items:baseline;gap:6px;padding-right:14px;border-right:1px solid var(--line)}
  .brand b{font-size:19px;letter-spacing:2px}
  .brand span{font-size:12px;color:var(--faint);letter-spacing:.5px}
  #presets{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}
  #presets::-webkit-scrollbar{display:none}
  .preset{
    white-space:nowrap;padding:7px 13px;border-radius:8px;font-size:14px;
    border:1px solid var(--line);background:#fff;color:var(--text);transition:.12s;
  }
  .preset:hover{border-color:#c3cbd4;background:#f5f7f9}
  .preset.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  .top-right{display:flex;gap:6px;align-items:center}
  .vbtn{
    padding:7px 12px;border-radius:8px;font-size:14px;border:1px solid var(--line);
    background:#fff;transition:.12s;
  }
  .vbtn:hover{background:#f5f7f9}
  .vbtn.on{background:var(--accent-soft);border-color:#a8c7e8;color:var(--accent);font-weight:500}

  /* ---------- 模型选择 ---------- */
  .model-pick{display:flex;flex-direction:column;gap:1px;flex:none;width:196px}
  .model-pick select{
    width:196px;font:inherit;font-size:14px;font-weight:500;padding:5px 8px;
    border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--text);
  }
  #model-tag{
    font-size:11px;color:var(--faint);line-height:1.25;padding-left:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  /* ---------- 配色切换 ---------- */
  #themes{display:flex;gap:2px;border:1px solid var(--line);border-radius:9px;padding:2px;background:#fff}
  .theme-btn{padding:5px 9px;border-radius:7px;font-size:13px;color:var(--muted);transition:.12s}
  .theme-btn:hover{background:#f2f4f7}
  .theme-btn.on{background:var(--accent);color:#fff;font-weight:500}

  /* ---------- 对比演示方式（叠加 / 分屏） ---------- */
  .cmp{display:flex;align-items:center;gap:6px}
  .cmp-lbl{font-size:13px;color:var(--muted)}
  .cmp.off{opacity:.4;pointer-events:none}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:#fff}
  .seg-b{padding:5px 9px;border-radius:7px;font-size:13px;color:var(--muted);transition:.12s}
  .seg-b:hover{background:#f2f4f7}
  .seg-b.on{background:var(--accent);color:#fff;font-weight:500}

  /* ---------- 侧栏 ---------- */
  aside{
    overflow-y:auto;background:var(--panel);padding:14px 16px 24px;
  }
  #left{border-right:1px solid var(--line)}
  #right{border-left:1px solid var(--line)}
  aside h2{
    font-size:12px;font-weight:600;color:var(--faint);letter-spacing:1.5px;
    margin:6px 0 10px;
  }
  aside h2:not(:first-child){margin-top:22px}

  .param{margin-bottom:15px}
  .param-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
  .param-label{font-size:14px}
  .param-label em{font-style:italic;color:var(--faint);font-size:12px;margin-left:3px}
  .param-val{display:flex;align-items:baseline;gap:4px}
  .param-val input{
    width:74px;text-align:right;font:inherit;font-size:14px;font-variant-numeric:tabular-nums;
    border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:#fff;color:var(--text);
  }
  .param-val input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .param-val i{font-style:normal;font-size:12px;color:var(--faint);min-width:26px}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#dfe4ea}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;
    border:2px solid var(--accent);margin-top:-6px;box-shadow:0 1px 3px rgba(0,0,0,.18);
  }
  input[type=range]:focus{outline:none}
  select{
    width:100%;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);
    border-radius:6px;background:#fff;color:var(--text);
  }

  .layer{display:flex;align-items:center;gap:9px;padding:5px 0;cursor:pointer;user-select:none}
  .layer input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
  .layer span{font-size:14px}
  .layer.off span{color:var(--faint)}

  .reading{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;gap:8px}
  .reading .k{font-size:13px;color:var(--muted)}
  .reading .v{font-size:14px;font-variant-numeric:tabular-nums;font-weight:500}
  .reading.hi .v{color:var(--accent)}
  .reading.sep{border-top:1px solid var(--line);margin-top:6px;padding-top:9px}

  /* ---------- 舞台 ---------- */
  #stage{position:relative;background:var(--canvas-bg,#fff);overflow:hidden}
  #view{display:block;width:100%;height:100%;touch-action:none}
  #labels{position:absolute;inset:0;pointer-events:none}
  .lbl{
    position:absolute;transform:translate(-50%,-50%);font-size:14px;font-weight:600;
    white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;
  }
  .lbl sub,.reading .k sub,.param-label sub{font-size:.72em;vertical-align:-.28em;font-style:normal}
  #hint{
    position:absolute;left:16px;top:14px;max-width:min(620px,74%);
    background:var(--hint-bg);border:1px solid var(--hint-line);border-radius:10px;padding:10px 14px;
    font-size:14px;line-height:1.6;box-shadow:0 2px 10px rgba(0,0,0,.05);
  }
  #hint b{color:var(--warn)}
  #hint .x{position:absolute;right:8px;top:6px;color:var(--faint);font-size:15px;padding:2px 5px}
  .hint-fx{display:block;margin-top:5px;padding-top:5px;border-top:1px dashed var(--hint-line);
    color:var(--muted);font-size:13px}

  /* ---------- 时间轴 ---------- */
  #timebar{
    grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 18px;
    border-top:1px solid var(--line);background:var(--panel);
  }
  .tb-btn{
    width:42px;height:42px;border-radius:9px;border:1px solid var(--line);background:#fff;
    display:grid;place-items:center;font-size:16px;transition:.12s;flex:none;
  }
  .tb-btn:hover{background:#f5f7f9}
  .tb-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tb-btn.wide{width:auto;padding:0 14px;font-size:14px}
  .tb-track{flex:1;display:flex;flex-direction:column;gap:2px;min-width:120px}
  .tb-info{
    font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .tb-info b{color:var(--text);font-size:15px}
  .tb-speed{display:flex;align-items:center;gap:8px;width:200px;flex:none}
  .tb-speed span{font-size:13px;color:var(--muted);white-space:nowrap}
  .tb-speed input{flex:1}

  /* ---------- 时间轴：时间段选择 ----------
     用 div 自绘而不是叠两个 <input type=range>：
     三个可拖柄（A、B、当前时刻）必须能各自命中，叠 range 会互相抢事件。 */
  .tl{position:relative;height:24px;cursor:pointer;touch-action:none;user-select:none}
  .tl-rail{position:absolute;left:0;right:0;top:10px;height:4px;border-radius:2px;background:#dfe4ea}
  .tl-sel{
    position:absolute;top:10px;height:4px;border-radius:2px;background:#fbeecf;
    border-left:2px solid var(--warn);border-right:2px solid var(--warn);
    box-sizing:content-box;margin-left:-2px;display:none;
  }
  .tl.on .tl-sel{display:block}
  .tl-h{
    position:absolute;top:12px;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;
    border-radius:50%;background:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  .tl-play{z-index:2}
  .tl-ha,.tl-hb{
    display:none;top:12px;width:12px;height:20px;margin:-10px 0 0 -6px;border-radius:4px;
    background:var(--warn);border:1px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.22);
    cursor:ew-resize;z-index:3;
  }
  .tl-ha::after,.tl-hb::after{
    content:'';position:absolute;left:50%;top:3px;bottom:3px;width:2px;margin-left:-1px;
    border-radius:1px;background:rgba(255,255,255,.85);
  }
  .tl.on .tl-ha,.tl.on .tl-hb{display:block}

  /* ---------- 标注层（屏幕空间） ---------- */
  #ink{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none;touch-action:none}
  #ink.show{display:block}
  #ink.live{pointer-events:auto;cursor:crosshair}
  #inkbar{
    position:absolute;right:14px;top:14px;width:158px;display:none;flex-direction:column;gap:8px;
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;
    box-shadow:0 4px 18px rgba(0,0,0,.1);z-index:6;
  }
  #inkbar.on{display:flex}
  .ink-row{display:flex;gap:5px;flex-wrap:wrap}
  .ink-t{
    padding:0 9px;height:30px;border-radius:7px;border:1px solid var(--line);background:#fff;
    font-size:13px;display:grid;place-items:center;transition:.12s;
  }
  .ink-t:hover{background:#f5f7f9}
  .ink-t.on{background:var(--accent-soft);border-color:#a8c7e8;color:var(--accent);font-weight:500}
  .ink-sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
  .ink-sw.on{box-shadow:0 0 0 2px var(--accent)}
  .ink-note{font-size:11px;color:var(--faint);line-height:1.5;border-top:1px solid var(--line);padding-top:7px}
  .ink-note b{color:var(--muted)}

  .side-tip{
    font-size:12px;color:var(--faint);line-height:1.6;margin-top:9px;
    padding-top:9px;border-top:1px solid var(--line);
  }
  .side-tip b{color:var(--muted);font-weight:600}

  /* ---------- 快捷键弹层 ---------- */
  #help{
    position:fixed;inset:0;background:rgba(20,24,30,.35);display:none;
    place-items:center;z-index:50;
  }
  #help.on{display:grid}
  .help-card{
    background:#fff;border-radius:14px;padding:24px 28px;min-width:360px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .help-card h3{font-size:17px;margin-bottom:14px}
  .help-card table{border-collapse:collapse;width:100%}
  .help-card td{padding:6px 0;font-size:14px}
  .help-card td:first-child{width:150px}
  kbd{
    display:inline-block;font:inherit;font-size:12px;padding:2px 7px;border-radius:5px;
    background:#f1f3f6;border:1px solid var(--line);border-bottom-width:2px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .help-card .close{margin-top:18px;width:100%;padding:9px;border-radius:8px;background:var(--accent);color:#fff;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><b>悟理</b><span>PhysViz</span></div>
    <div class="model-pick">
      <select id="model-sel" title="切换模型（M 键循环）"></select>
      <span id="model-tag"></span>
    </div>
    <div id="presets"></div>
    <div class="top-right">
      <div id="themes" title="配色（T 键循环）"></div>
      <div id="cmp" class="cmp" title="对比演示方式（叠加 / 分屏）">
        <span class="cmp-lbl">对比</span>
        <div class="seg" id="cmp-seg">
          <button class="seg-b on" data-m="overlay">叠加</button>
          <button class="seg-b" data-m="split">分屏</button>
        </div>
      </div>
      <button class="vbtn" id="btn-ink" title="标注：画圈、高亮轨迹（D）">标注</button>
      <button class="vbtn" id="btn-help">快捷键</button>
    </div>
  </header>

  <aside id="left">
    <h2>参数</h2>
    <div id="params"></div>
  </aside>

  <main id="stage">
    <canvas id="view"></canvas>
    <canvas id="ink"></canvas>
    <div id="labels"></div>
    <div id="hint"></div>
    <div id="inkbar">
      <div class="ink-row" id="ink-modes"></div>
      <div class="ink-row" id="ink-tools"></div>
      <div class="ink-row" id="ink-colors"></div>
      <div class="ink-row">
        <button class="ink-t" id="ink-undo">撤销</button>
        <button class="ink-t" id="ink-clear">清空</button>
        <button class="ink-t" id="ink-save">存图</button>
        <button class="ink-t" id="ink-exit">退出</button>
      </div>
      <div class="ink-note">按住 <b>Shift</b> 拖动可旋转视角</div>
    </div>
  </main>

  <aside id="right">
    <h2>图层</h2>
    <div id="layers"></div>
    <h2>实时读数</h2>
    <div id="readings"></div>
  </aside>

  <footer id="timebar">
    <button class="tb-btn" id="btn-play" title="播放 / 暂停（空格）">▶</button>
    <button class="tb-btn wide" id="btn-dir" title="切换播放方向">正向</button>
    <button class="tb-btn wide" id="btn-reset" title="复位到预设初始值（R）">复位</button>
    <button class="tb-btn wide" id="btn-fit" title="让轨迹重新填满视野">适应视图</button>
    <button class="tb-btn wide" id="btn-range" title="选定一段时间段，播放只在这一段里循环（X）">区间</button>
    <div class="tb-track">
      <div class="tl" id="tl">
        <div class="tl-rail"></div>
        <div class="tl-sel" id="tl-sel"></div>
        <div class="tl-h tl-ha" id="tl-a" data-h="a" title="区间起点 A"></div>
        <div class="tl-h tl-hb" id="tl-b" data-h="b" title="区间终点 B"></div>
        <div class="tl-h tl-play" id="tl-t" data-h="t" title="当前时刻"></div>
      </div>
      <div class="tb-info" id="tb-info"></div>
    </div>
    <div class="tb-speed">
      <span>速度</span>
      <input type="range" id="speed" min="0" max="1000" step="1">
      <span id="speed-txt" style="width:80px;text-align:right"></span>
    </div>
  </footer>
</div>

<div id="help">
  <div class="help-card">
    <h3>快捷键</h3>
    <table>
      <tr><td><kbd>空格</kbd></td><td>播放 / 暂停</td></tr>
      <tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>时间轴后退 / 前进（翻页笔用这个）</td></tr>
      <tr><td><kbd>1</kbd>–<kbd>9</kbd></td><td>跳到第 N 个周期的整数倍</td></tr>
      <tr><td><kbd>Shift</kbd> + <kbd>1</kbd>–<kbd>9</kbd></td><td>开关第 N 个图层</td></tr>
      <tr><td><kbd>↑</kbd> <kbd>↓</kbd> <kbd>PgUp</kbd> <kbd>PgDn</kbd></td><td>切换上一个 / 下一个预设例题</td></tr>
      <tr><td><kbd>M</kbd></td><td>循环切换模型</td></tr>
      <tr><td><kbd>V</kbd></td><td>循环切换视角</td></tr>
      <tr><td><kbd>T</kbd></td><td>循环切换配色</td></tr>
      <tr><td><kbd>R</kbd></td><td>复位参数</td></tr>
      <tr><td><kbd>X</kbd></td><td>开 / 关时间段选择</td></tr>
      <tr><td><kbd>D</kbd></td><td>开 / 关标注面板</td></tr>
      <tr><td><kbd>Shift</kbd> + 拖动</td><td>标注模式下旋转视角</td></tr>
      <tr><td>双指拖动</td><td>触摸板 / 触屏上移动画面（平移相机）</td></tr>
      <tr><td><kbd>F</kbd></td><td>全屏</td></tr>
      <tr><td><kbd>Esc</kbd></td><td>关闭本窗口</td></tr>
    </table>
    <button class="close" id="btn-help-close">知道了</button>
  </div>
</div>

<script>/*BUNDLE*/</script>
</body>
</html>
